name: Guardian Mobile v0.8.1 Diagnostic Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source from checked-out payload
        id: source
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p /tmp/guardian-project
          cat guardian-ci/payload-1.b64 guardian-ci/payload-2.b64 guardian-ci/payload-3.b64 guardian-ci/payload-4.b64 guardian-ci/payload-5.b64 > /tmp/guardian-source.b64
          echo "BASE64_BYTES=$(wc -c < /tmp/guardian-source.b64)" | tee /tmp/guardian-source-status.txt
          base64 --decode /tmp/guardian-source.b64 > /tmp/guardian-source.tar.xz
          sha256sum /tmp/guardian-source.tar.xz | tee -a /tmp/guardian-source-status.txt
          echo "5ed534318e4fae2f16571cf1d37932343d90c975c1f86a4f7f9a080b6b6ab83d  /tmp/guardian-source.tar.xz" | sha256sum -c - | tee -a /tmp/guardian-source-status.txt
          tar -xJf /tmp/guardian-source.tar.xz -C /tmp/guardian-project
          find /tmp/guardian-project -maxdepth 2 -type f | sort | tee -a /tmp/guardian-source-status.txt
          test -f /tmp/guardian-project/app/build.gradle.kts
      - uses: actions/setup-java@v4
        if: steps.source.outcome == 'success'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        if: steps.source.outcome == 'success'
      - name: Install Android API 37
        if: steps.source.outcome == 'success'
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.source.outcome == 'success'
        with:
          gradle-version: '9.5.0'
      - name: Compile Guardian APK
        id: compile
        if: steps.source.outcome == 'success'
        continue-on-error: true
        working-directory: /tmp/guardian-project
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee /tmp/guardian-build.log
      - name: Record APK
        if: steps.compile.outcome == 'success'
        run: |
          APK=/tmp/guardian-project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee /tmp/guardian-apk-sha.txt
          cp "$APK" /tmp/Guardian-Mobile-v0.8.1-debug.apk
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Guardian-Mobile-v0.8.1-diagnostics
          path: |
            /tmp/guardian-source-status.txt
            /tmp/guardian-build.log
            /tmp/guardian-apk-sha.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Upload APK
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Guardian-Mobile-v0.8.1-debug
          path: /tmp/Guardian-Mobile-v0.8.1-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Final build verdict
        if: steps.source.outcome != 'success' || steps.compile.outcome != 'success'
        run: exit 1
